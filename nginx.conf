; Это актуальная version-controlled копия production-конфигурации Nginx расположенной на сервере
; оставлена в проекте для ознакомления и не участвует в Docker-деплое на сервере
; Её копия находится на сервере в /opt/lumos/nginx.conf
; при обновлении конфига nginx.conf, скопировать его в /opt/lumos на сервере (на сервере этот файл в этом месте также является
; version-controlled копией production-конфигурации Nginx) и затем применить команду:
; sudo cp /opt/lumos/nginx.conf /etc/nginx/conf.d/lumos.conf
; далее:
; sudo nginx -t                           проверка конфига
; sudo systemctl reload nginx             Nginx, прочитай и примени новые конфиги nginx.conf

server {
    listen 80;
    server_name lumosapp.net www.lumosapp.net;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Все остальные запросы → Next.js
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lumosapp.net www.lumosapp.net;

    ssl_certificate /etc/letsencrypt/live/lumosapp.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lumosapp.net/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
